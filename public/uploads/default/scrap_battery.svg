<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="batBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="batCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#batBg)"/>
  <!-- Automotive Lead-Acid Battery -->
  <!-- Terminals -->
  <rect x="52" y="44" width="18" height="14" rx="3" fill="#ef4444"/>
  <rect x="58" y="40" width="6" height="4" fill="#991b1b"/>
  <text x="61" y="55" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

  <rect x="130" y="44" width="18" height="14" rx="3" fill="#3b82f6"/>
  <rect x="136" y="40" width="6" height="4" fill="#1d4ed8"/>
  <text x="139" y="55" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <!-- Battery Main Case -->
  <rect x="36" y="58" width="128" height="102" rx="8" fill="url(#batCase)"/>
  <!-- Top Handle -->
  <path d="M60 58 Q100 26 140 58" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Front Label -->
  <rect x="46" y="78" width="108" height="68" rx="4" fill="#1e3a8a"/>
  <!-- Lightning bolt & Spec -->
  <polygon points="100,84 92,106 102,106 96,128 114,102 104,102" fill="#fbbf24"/>
  <text x="100" y="140" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#93c5fd" text-anchor="middle">12V LEAD-ACID 60Ah</text>
</svg>
