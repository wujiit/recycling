<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="alBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="alProfile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#alBg)"/>
  <!-- Aluminum Extruded Profiles Stack -->
  <g transform="translate(25, 45)">
    <!-- Bar 1 -->
    <path d="M20 20 L100 20 L130 50 L50 50 Z" fill="#e2e8f0"/>
    <path d="M20 20 L20 40 L50 70 L50 50 Z" fill="#94a3b8"/>
    <path d="M50 70 L130 70 L130 50 L50 50 Z" fill="#cbd5e1"/>
    <!-- Hollow Core Detail -->
    <rect x="30" y="28" width="12" height="12" fill="#64748b" transform="skewX(-45)"/>
    <!-- Bar 2 stacked -->
    <path d="M30 65 L110 65 L140 95 L60 95 Z" fill="#f1f5f9"/>
    <path d="M30 65 L30 85 L60 115 L60 95 Z" fill="#64748b"/>
    <path d="M60 115 L140 115 L140 95 L60 95 Z" fill="#94a3b8"/>
  </g>
  <circle cx="100" cy="35" r="16" fill="#64748b"/>
  <text x="100" y="39" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Al</text>
</svg>
