  <!-- Lens Mount & Big Glass Lens -->
  <circle cx="95" cy="108" r="42" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="95" cy="108" r="34" fill="#1e293b"/>
  <circle cx="95" cy="108" r="26" fill="url(#lensReflect)"/>
  <ellipse cx="88" cy="98" rx="8" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 88 98)"/>
  <circle cx="138" cy="80" r="4" fill="#ef4444"/>
