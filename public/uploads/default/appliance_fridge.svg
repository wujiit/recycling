<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="frBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="fridgeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#frBg)"/>
  <!-- Refrigerator Body -->
  <rect x="55" y="25" width="90" height="150" rx="8" fill="url(#fridgeMetal)" stroke="#475569" stroke-width="2"/>
  <!-- Top Refrigerator Door -->
  <rect x="58" y="28" width="84" height="62" rx="4" fill="#f8fafc"/>
  <rect x="62" y="50" width="4" height="24" rx="2" fill="#64748b"/>
  <!-- Display Panel -->
  <rect x="115" y="45" width="18" height="22" rx="3" fill="#1e293b"/>
  <text x="124" y="55" font-family="-apple-system, sans-serif" font-size="7" fill="#38bdf8" text-anchor="middle">4°C</text>
  <text x="124" y="63" font-family="-apple-system, sans-serif" font-size="7" fill="#38bdf8" text-anchor="middle">-18°C</text>
  <!-- Door Divider Gap -->
  <line x1="55" y1="92" x2="145" y2="92" stroke="#475569" stroke-width="3"/>
  <!-- Bottom Freezer Door -->
  <rect x="58" y="94" width="84" height="77" rx="4" fill="#f1f5f9"/>
  <rect x="62" y="105" width="4" height="28" rx="2" fill="#64748b"/>
</svg>
