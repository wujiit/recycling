  <rect x="92" y="138" width="9" height="20" rx="4" fill="#b45309"/>
  <rect x="118" y="136" width="10" height="22" rx="4" fill="#d97706"/>
  <rect x="134" y="138" width="9" height="20" rx="4" fill="#b45309"/>
  <!-- GPS Tracking Pin Tag -->
  <g transform="translate(142, 38)">
    <circle cx="15" cy="15" r="14" fill="#10b981"/>
    <path d="M15 6 C11 6 8 9 8 13 C8 18 15 24 15 24 C15 24 22 18 22 13 C22 9 19 6 15 6 Z" fill="#ffffff"/>
