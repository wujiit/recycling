<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="dogFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#dogBg)"/>
  <!-- Decorative background grass circle -->
  <circle cx="100" cy="115" r="62" fill="#ecfdf5"/>
  <!-- Dog Body -->
  <path d="M60 125 C60 98 85 92 110 95 C125 97 142 108 145 125 C146 132 140 142 130 142 L72 142 C64 142 60 135 60 125 Z" fill="url(#dogFur)"/>
