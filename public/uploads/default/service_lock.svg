<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="silverSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#lockBg)"/>
  
  <!-- Security Shield in background -->
  <path d="M100 24 C128 34 156 32 156 56 C156 102 128 140 100 152 C72 140 44 102 44 56 C44 32 72 34 100 24 Z" fill="url(#shieldGrad)" opacity="0.15"/>

  <!-- Super-C Grade Brass Lock Cylinder Body -->
  <g transform="translate(62, 54)">
    <!-- Main Cylinder Body (Solid Brass) -->
    <rect x="0" y="22" width="76" height="54" rx="10" fill="url(#goldBrass)"/>
    <ellipse cx="38" cy="22" rx="38" ry="14" fill="#fde68a"/>
    <ellipse cx="38" cy="22" rx="35" ry="12" fill="url(#goldBrass)"/>
    
    <!-- Cylinder Core / Key Slot -->
    <circle cx="38" cy="48" r="18" fill="url(#silverSteel)"/>
    <circle cx="38" cy="48" r="15" fill="#334155"/>
    <rect x="36" y="38" width="4" height="20" rx="2" fill="#0f172a"/>
    <circle cx="38" cy="44" r="3.5" fill="#f8fafc"/>
    <rect x="36" y="44" width="4" height="12" fill="#f8fafc"/>

    <!-- Cylinder fixing bottom lug (standard European/Chinese mortise lock profile) -->
    <path d="M26 76 L26 94 C26 98 50 98 50 94 L50 76 Z" fill="url(#goldBrass)"/>
    <circle cx="38" cy="85" r="4" fill="#78350f"/>
  </g>

  <!-- High-Security Dimple / Snake Blade Key -->
  <g transform="translate(112, 108) rotate(-42)">
    <!-- Key Bow / Handle -->
    <rect x="0" y="10" width="32" height="24" rx="7" fill="url(#silverSteel)"/>
    <circle cx="16" cy="22" r="5" fill="#f1f5f9"/>
    <!-- Key Shoulder -->
    <rect x="30" y="14" width="8" height="16" rx="2" fill="url(#silverSteel)"/>
    <!-- Key Blade -->
    <rect x="36" y="17" width="52" height="10" rx="3" fill="url(#silverSteel)"/>
    <!-- Snake Track / Laser Cut Grooves (Class C signature) -->
    <path d="M42 20 Q50 24 58 20 T74 22" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="23" r="1.5" fill="#334155"/>
    <circle cx="64" cy="21" r="1.5" fill="#334155"/>
    <circle cx="76" cy="23" r="1.5" fill="#334155"/>
  </g>

  <!-- Security Verified Check Badge -->
  <g transform="translate(136, 136)">
    <circle cx="16" cy="16" r="16" fill="#10b981"/>
    <path d="M10 16 L14 20 L22 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>