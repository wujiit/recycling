<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="sprayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#cleanBg)"/>
  <!-- Decorative clean circle -->
  <circle cx="100" cy="105" r="60" fill="#ffffff" opacity="0.8"/>
  <!-- Spray Bottle -->
  <g transform="translate(58, 60)">
    <!-- Bottle body -->
    <path d="M12 40 L32 40 L36 85 C36 88 33 90 30 90 L14 90 C11 90 8 88 8 85 Z" fill="url(#sprayGrad)"/>
    <!-- Bottle neck -->
    <rect x="18" y="26" width="8" height="14" fill="#10b981"/>
    <!-- Trigger head -->
    <path d="M14 14 L30 14 L38 26 L12 26 Z" fill="#047857"/>
    <!-- Nozzle -->
    <rect x="6" y="16" width="8" height="6" rx="2" fill="#065f46"/>
    <!-- Spray mist lines -->
    <line x1="2" y1="19" x2="-10" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="19" x2="-14" y2="19" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="19" x2="-10" y2="26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Microfiber Mop / Floor Squeegee -->
  <g transform="translate(105, 55)">
    <!-- Handle -->
    <line x1="45" y1="15" x2="15" y2="85" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- Mop head holder -->
    <ellipse cx="12" cy="88" rx="20" ry="6" transform="rotate(-25 12 88)" fill="#0284c7"/>
    <!-- Cloth pad -->
    <rect x="-8" y="86" width="38" height="8" rx="3" transform="rotate(-25 12 88)" fill="#38bdf8"/>
  </g>
  <!-- Big Sparkles / Shine -->
  <polygon points="150,55 153,65 163,68 153,71 150,81 147,71 137,68 147,65" fill="#f59e0b"/>
  <polygon points="52,48 54,54 60,56 54,58 52,64 50,58 44,56 50,54" fill="#10b981"/>
  <polygon points="120,138 122,143 127,145 122,147 120,152 118,147 113,145 118,143" fill="#38bdf8"/>
  <!-- Clean Sparkle Star -->
  <circle cx="102" cy="148" r="3" fill="#fbbf24"/>
</svg>
