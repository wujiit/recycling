<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hoodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#hoodBg)"/>
  <!-- Range Hood Chimney Stack -->
  <rect x="75" y="35" width="50" height="45" fill="url(#metalGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Hood Canopy (Angled Side-Draft Style) -->
  <path d="M40 80 L160 80 L175 130 L25 130 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Front Glass Panel -->
  <path d="M48 88 L152 88 L165 124 L35 124 Z" fill="url(#glassGrad)"/>
  <!-- Center Baffle Filter -->
  <rect x="70" y="96" width="60" height="22" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- LED Light Strips -->
  <rect x="52" y="120" width="24" height="4" rx="2" fill="#fef08a"/>
  <rect x="124" y="120" width="24" height="4" rx="2" fill="#fef08a"/>
  <!-- High Temp Steam Jet Visuals -->
  <path d="M85 155 Q80 135 90 126" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M100 160 Q105 140 100 126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M115 155 Q120 135 110 126" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Steam nozzle tool -->
  <path d="M96 162 L104 162 L102 178 L98 178 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <!-- Sparkles for cleanliness -->
  <polygon points="152,70 155,77 162,80 155,83 152,90 149,83 142,80 149,77" fill="#f59e0b"/>
  <polygon points="46,65 48,70 53,72 48,74 46,79 44,74 39,72 44,70" fill="#38bdf8"/>
</svg>
