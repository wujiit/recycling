<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>启灵同城服务 · 统一收银台</title>
    <style>
        :root {
            --primary: #1e58ff;
            --primary-hover: #1746cc;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-600: #475569;
            --slate-400: #94a3b8;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6fa;
            color: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--slate-900);
            font-weight: 700;
            font-size: 16px;
        }
        .header-logo {
            width: 32px;
            height: 32px;
            background: var(--primary);
            color: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }
        .cashier-container {
            max-width: 680px;
            width: 100%;
            margin: 32px auto;
            padding: 0 16px;
            flex: 1;
        }
        .cashier-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .order-summary {
            background: linear-gradient(135deg, #1e58ff 0%, #3b82f6 100%);
            color: #fff;
            padding: 28px 24px;
            text-align: center;
            position: relative;
        }
        .order-amount-label { font-size: 13px; opacity: 0.9; margin-bottom: 6px; }
        .order-amount { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
        .order-title { font-size: 15px; margin-top: 8px; opacity: 0.95; }
        .order-meta-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 14px;
            font-size: 12px;
            opacity: 0.85;
            flex-wrap: wrap;
        }
        .payment-body {
            padding: 24px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .channel-item:hover {
            border-color: #cbd5e1;
            background: var(--slate-50);
        }
        .channel-item.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }
        .channel-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .channel-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .channel-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--slate-900);
        }
        .channel-desc {
            font-size: 12px;
            color: var(--slate-600);
            margin-top: 2px;
        }
        .channel-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .channel-item.selected .channel-radio {
            border-color: var(--primary);
        }
        .channel-item.selected .channel-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }
        .pay-action-box {
            text-align: center;
            margin-top: 20px;
        }
        .btn-pay {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-pay:hover { background: var(--primary-hover); }
        .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; }

        .qrcode-box {
            display: none;
            text-align: center;
            padding: 24px 0 10px 0;
            border-top: 1px dashed var(--border);
            margin-top: 20px;
        }
        .qrcode-img-wrap {
            width: 180px;
            height: 180px;
            margin: 0 auto 14px auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qrcode-tip {
            font-size: 13px;
            color: var(--slate-600);
        }
        .success-box {
            display: none;
            text-align: center;
            padding: 50px 24px;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background: #dcfce7;
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px auto;
        }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--slate-400);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="header-brand">
            <div class="header-logo">启</div>
            <span>启灵同城服务 · 安全收银台</span>
        </a>
        <div style="font-size:12px;color:var(--slate-600);">
            🔒 256位金融级 SSL 加密传输
        </div>
    </header>

    <main class="cashier-container">
        <div class="cashier-card">
            <!-- 支付中主面板 -->
            <div id="cashier-main-panel">
                <div class="order-summary">
                    <div class="order-amount-label">应付服务金额</div>
                    <div class="order-amount" id="sum-amount">¥ --</div>
                    <div class="order-title" id="sum-title">正在加载订单详情...</div>
                    <div class="order-meta-bar">
                        <span>订单号：<strong id="sum-ordersn" style="font-family:monospace;">--</strong></span>
                        <span id="sum-spec" style="display:none;">规格：<strong>--</strong></span>
                        <span>支付超时：<strong id="pay-timer">15:00</strong></span>
                    </div>
                </div>

                <div class="payment-body">
                    <div class="section-title">
                        <span>💳</span> 请选择支付方式
                    </div>

                    <div class="channel-list" id="channels-container">
                        <!-- 动态注入可用渠道 -->
                    </div>

                    <div class="pay-action-box">
                        <button class="btn-pay" id="btn-submit-pay">立即支付</button>
                    </div>

                    <!-- 二维码扫码支付展示区 (PC 端) -->
                    <div class="qrcode-box" id="qrcode-box">
                        <div class="qrcode-img-wrap" id="qrcode-img-wrap">
                            <img id="qrcode-img" src="" alt="支付二维码" style="max-width:100%;max-height:100%;display:none;">
                            <div id="qrcode-loading" style="font-size:12px;color:var(--slate-400);">生成二维码中...</div>
                        </div>
                        <div class="qrcode-tip" id="qrcode-tip">请使用手机扫码完成支付</div>
                    </div>
                </div>
            </div>

            <!-- 支付成功状态面板 -->
            <div class="success-box" id="cashier-success-panel">
                <div class="success-icon">✓</div>
                <h2 style="font-size:22px;color:var(--slate-900);margin-bottom:8px;">订单支付成功！</h2>
                <p style="font-size:14px;color:var(--slate-600);margin-bottom:24px;">平台已收到您的服务款项，正在调度师傅竭诚为您上门服务。</p>
                <div style="display:flex;gap:12px;justify-content:center;">
                    <a href="/" style="padding:10px 24px;background:#1e58ff;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;">返回平台首页</a>
                    <a href="javascript:void(0)" id="btn-view-order" style="padding:10px 24px;background:#f1f5f9;color:#334155;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;">查看订单进度</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        启灵同城生活服务综合平台 · 正向结算与资金存管保障系统
    </footer>

    <script>
        (function () {
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            const orderSn = urlParams.get('order_sn') || '';
            let selectedChannel = 'wechat';
            let checkTimer = null;
            let currentOrder = null;

            if (!orderSn) {
                alert('缺少订单编号，无法打开收银台');
                window.location.href = '/';
                return;
            }

            // 获取 Token
            const token = localStorage.getItem('ql_recycle_token') || localStorage.getItem('ql_user_token') || '';

            async function requestApi(endpoint, method = 'GET', body = null) {
                const sep = endpoint.includes('?') ? '&' : '?';
                const url = endpoint + sep + (token ? ('token=' + encodeURIComponent(token)) : '');
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                };
                if (body && method !== 'GET') {
                    options.body = JSON.stringify(body);
                }
                const res = await fetch(url, options);
                return await res.json();
            }

            // 初始化加载订单收银详情
            async function loadCashier() {
                try {
                    const res = await requestApi('/api/payment/cashier&order_sn=' + encodeURIComponent(orderSn));
                    if (!res || res.code !== 200 || !res.data) {
                        alert(res ? res.msg : '加载订单收银台失败');
                        return;
                    }

                    const data = res.data;
                    currentOrder = data;

                    if (data.pay_status === 'paid') {
                        showSuccess();
                        return;
                    }

                    document.getElementById('sum-amount').innerText = '¥ ' + (data.pay_price || '0.00');
                    document.getElementById('sum-title').innerText = data.device_name || '同城生活服务订单';
                    document.getElementById('sum-ordersn').innerText = data.order_sn;

                    if (data.spec_name) {
                        const specEl = document.getElementById('sum-spec');
                        specEl.style.display = 'inline';
                        specEl.innerHTML = '规格：<strong>' + data.spec_name + '</strong>';
                    }

                    renderChannels(data.channels || []);
                    startPollingCheck();
                } catch (e) {
                    alert('网络通信异常，请刷新重试');
                }
            }

            function renderChannels(channels) {
                const box = document.getElementById('channels-container');
                if (!channels || channels.length === 0) {
                    box.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;">暂无可用的支付通道</div>';
                    return;
                }

                selectedChannel = channels[0].key;
                let html = '';
                channels.forEach((ch, idx) => {
                    const isSel = idx === 0 ? 'selected' : '';
                    let iconBg = '#22c55e';
                    let iconText = '💬';
                    if (ch.key === 'alipay') {
                        iconBg = '#0284c7';
                        iconText = '支';
                    } else if (ch.key === 'dev_mock') {
                        iconBg = '#f59e0b';
                        iconText = '⚡';
                    }

                    html += `
                        <div class="channel-item ${isSel}" data-key="${ch.key}">
                            <div class="channel-left">
                                <div class="channel-icon" style="background:${iconBg};color:#fff;">${iconText}</div>
                                <div>
                                    <div class="channel-name">${ch.name}</div>
                                    <div class="channel-desc">${ch.desc || ''}</div>
                                </div>
                            </div>
                            <div class="channel-radio"></div>
                        </div>
                    `;
                });
                box.innerHTML = html;

                document.querySelectorAll('.channel-item').forEach(el => {
                    el.addEventListener('click', function () {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedChannel = this.getAttribute('data-key');
                    });
                });
            }

            // 提交支付
            document.getElementById('btn-submit-pay')?.addEventListener('click', async function () {
                const btn = this;
                btn.disabled = true;
                btn.innerText = '正在调起支付...';

                try {
                    if (selectedChannel === 'dev_mock') {
                        // 沙箱模拟支付
                        const res = await requestApi('/api/payment/mockPay', 'POST', { order_sn: orderSn });
                        if (res && res.code === 200) {
                            showSuccess();
                        } else {
                            alert(res ? res.msg : '模拟支付未成功');
                            btn.disabled = false;
                            btn.innerText = '立即支付';
                        }
                        return;
                    }

                    const res = await requestApi('/api/payment/create', 'POST', {
                        order_sn: orderSn,
                        pay_type: selectedChannel
                    });

                    if (res && res.code === 200 && res.data) {
                        const payData = res.data;
                        if (payData.pay_url) {
                            // Wap / H5 支付直接跳转
                            window.location.href = payData.pay_url;
                            return;
                        }

                        if (payData.code_url) {
                            // 展示原生二维码
                            showQrCode(payData.code_url, selectedChannel);
                            btn.disabled = false;
                            btn.innerText = '等待扫码支付中...';
                            return;
                        }

                        alert('已调起支付，请在客户端完成确认');
                    } else {
                        alert(res ? res.msg : '调起支付失败');
                        btn.disabled = false;
                        btn.innerText = '立即支付';
                    }
                } catch (e) {
                    alert('网络异常');
                    btn.disabled = false;
                    btn.innerText = '立即支付';
                }
            });

            function showQrCode(url, channel) {
                const qbox = document.getElementById('qrcode-box');
                const img = document.getElementById('qrcode-img');
                const loading = document.getElementById('qrcode-loading');
                const tip = document.getElementById('qrcode-tip');

                qbox.style.display = 'block';
                // 使用公共 QR 转换渲染
                img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
                img.onload = () => {
                    loading.style.display = 'none';
                    img.style.display = 'block';
                };
                img.onerror = () => {
                    loading.innerText = '请在新页面打开支付链接：' + url;
                };

                tip.innerText = channel === 'alipay' ? '请使用手机支付宝扫码支付' : '请使用微信扫一扫完成支付';
            }

            // 轮询支付状态
            function startPollingCheck() {
                if (checkTimer) clearInterval(checkTimer);
                checkTimer = setInterval(async () => {
                    try {
                        const res = await requestApi('/api/payment/check&order_sn=' + encodeURIComponent(orderSn));
                        if (res && res.code === 200 && res.data && res.data.pay_status === 'paid') {
                            clearInterval(checkTimer);
                            showSuccess();
                        }
                    } catch (e) {}
                }, 2500);
            }

            function showSuccess() {
                if (checkTimer) clearInterval(checkTimer);
                document.getElementById('cashier-main-panel').style.display = 'none';
                document.getElementById('cashier-success-panel').style.display = 'block';

                document.getElementById('btn-view-order')?.addEventListener('click', () => {
                    window.location.href = '/?tab=orders&sn=' + encodeURIComponent(orderSn);
                });
            }

            // 倒计时
            let timeLeft = 900;
            const timerEl = document.getElementById('pay-timer');
            const interval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerEl.innerText = '已超时';
                } else {
                    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                    const s = (timeLeft % 60).toString().padStart(2, '0');
                    timerEl.innerText = m + ':' + s;
                }
            }, 1000);

            loadCashier();
        })();
    </script>
</body>
</html>
